<div class="flex items-center px-4 py-3" [ngClass]="isAutenticated ? 'justify-between' : 'justify-end'">
    @if (isAutenticated) {
        <button type="button" (click)="visible = true" class="flex items-center gap-2 rounded-xl border border-gray-200 bg-white px-4 py-2 text-sm font-semibold text-gray-700 shadow-sm transition-all hover:bg-gray-50 hover:shadow-md">
            <i class="pi pi-bars text-sm"></i>
            <span>Menú</span>
        </button>
    }


</div>

<p-drawer [(visible)]="visible" [modal]="false" header="Menú de navegación">
    <div class="mb-5 rounded-2xl bg-gradient-to-br from-stone-50 via-white to-stone-100 p-4">
        <div class="flex items-center gap-3">
            <div class="flex h-12 w-12 shrink-0 items-center justify-center rounded-full bg-[#886849] text-white shadow-sm">
                <i class="pi pi-user"></i>
            </div>

            <div class="min-w-0">
                <p class="text-xs font-semibold uppercase tracking-[0.16em] text-gray-400">Usuario</p>
                <p class="truncate text-base font-bold text-gray-700">{{ getUser }}</p>
            </div>
        </div>
    </div>

    @if (isAutenticated) {
        <nav>
            <p class="mb-2 px-2 text-[10px] font-bold uppercase tracking-[0.18em] text-gray-400">Navegación</p>

            <ul class="flex flex-col gap-1 p-0">
                <li>
                    <a routerLink="/Auth/main-filter" (click)="visible = false"
                        class="flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-semibold text-gray-600 no-underline transition-all hover:bg-gray-100 hover:text-gray-900"
                        routerLinkActive="bg-stone-100 !text-[#886849]">
                        <i class="pi pi-filter w-5 text-center"></i>
                        <span>Nuevo filtro</span>
                    </a>
                </li>

                @if (scope == 'NIVEL') {
                    <li>
                        <a routerLink="/e/estadistica-general" (click)="visible = false"
                            class="flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-semibold text-gray-600 no-underline transition-all hover:bg-gray-100 hover:text-gray-900"
                            routerLinkActive="bg-stone-100 !text-[#886849]">
                            <i class="pi pi-chart-bar w-5 text-center"></i>
                            <span>Estadística general</span>
                        </a>
                    </li>
                }

                @if (scope == 'EJECUTIVO' || scope == 'ADMIN') {
                    <li>
                        <a routerLink="/admin/register" (click)="visible = false"
                            class="flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-semibold text-gray-600 no-underline transition-all hover:bg-gray-100 hover:text-gray-900"
                            routerLinkActive="bg-stone-100 !text-[#886849]">
                            <i class="pi pi-user-plus w-5 text-center"></i>
                            <span>Nuevo usuario</span>
                        </a>
                    </li>
                }

                @if (scope == 'ADMIN') {
                    <li>
                        <a routerLink="/admin/listado-usuarios" (click)="visible = false"
                            class="flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-semibold text-gray-600 no-underline transition-all hover:bg-gray-100 hover:text-gray-900"
                            routerLinkActive="bg-stone-100 !text-[#886849]">
                            <i class="pi pi-users w-5 text-center"></i>
                            <span>Listado de usuarios</span>
                        </a>
                    </li>
                }
            </ul>

            <div class="my-4 border-t border-gray-100"></div>

            <button type="button" (click)="visible = false; confirmCloseSesion($event)"
                class="flex w-full items-center gap-3 rounded-xl px-3 py-3 text-left text-sm font-semibold text-red-500 transition-all hover:bg-red-50 hover:text-red-600">
                <i class="pi pi-sign-out w-5 text-center"></i>
                <span>Cerrar sesión</span>
            </button>
        </nav>
    }
</p-drawer>

<p-confirmdialog />
<p-toast />
