<div
  class="loader-pantalla"
  [attr.data-variante]="variante"
  role="status"
  aria-live="polite"
  aria-atomic="true">

  <span class="loader-sr-only">
    Cargando información. Los resultados se mostrarán al finalizar.
  </span>

  <div
    class="loader-decoracion"
    aria-hidden="true">
  </div>

  <div
    class="loader-contenido"
    aria-hidden="true">

    <div class="loader-identidad">

      <div class="loader-marca">
        IMAEB
      </div>

      <p class="loader-submarca">
        Alumnos y Alumnas
      </p>

    </div>

    <div class="loader-divisor"></div>

    <div class="loader-estado">

      <div
        class="loader-puntos"
        aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
      </div>

      <div class="loader-mensajes">

        @for (mensaje of mensajes; track $index) {

          <span
            class="loader-mensaje"
            [class.loader-mensaje-final]="$last"
            [style.animationDelay]="($index * duracionMensaje) + 's'"
            [style.animationDuration]="duracionMensaje + 's'">

            {{ mensaje }}

          </span>

        }

      </div>

    </div>

    <div class="loader-progreso">
      <span class="loader-avance"></span>
    </div>

  </div>

</div>
