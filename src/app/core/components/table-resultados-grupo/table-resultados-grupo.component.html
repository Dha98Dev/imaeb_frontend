<div class="mb-4 flex items-center justify-between gap-4">
    <div class="relative w-full max-w-md">
        <i class="pi pi-search absolute left-3 top-1/2 -translate-y-1/2 text-sm text-gray-400"></i>
        <input type="text" [(ngModel)]="filtroGlobal" (input)="aplicarFiltrosCombinados()" placeholder="Buscar alumno o resultado..." class="w-full rounded-xl border border-gray-200 bg-white py-2.5 pl-9 pr-4 text-sm text-gray-700 outline-none transition-all duration-200 placeholder:text-gray-400 focus:border-c1 focus:ring-2 focus:ring-c1/10">
    </div>

    <span class="shrink-0 text-xs font-medium text-gray-400">{{ alumnosFiltrados.length }} registros</span>
</div>

@if (encabezados.length > 0) {
    <div class="overflow-hidden rounded-2xl border border-gray-200 bg-white shadow-sm">
        <div class="overflow-x-auto">
            <table class="w-full min-w-max border-collapse text-xs" id="resultadosBusqueda">
                <thead>
                    <tr class="border-b border-gray-200 bg-gray-50">
                        @for (item of encabezados; track $index) {
                            <th class="whitespace-nowrap px-3 py-3 text-center text-[10px] font-bold uppercase tracking-wide text-gray-500">{{ item }}</th>
                        }
                    </tr>
                </thead>

                <tbody class="divide-y divide-gray-100">
                    @for (al of alumnosFiltrados; let i = $index; track $index) {
                        <tr class="cursor-pointer bg-white transition-all duration-200 hover:bg-slate-50"
                            [title]="'Ver detalles de ' + al['APELLIDO_P'] + ' ' + al['APELLIDO_M'] + ' ' + al['NOMBRE']"
                            (click)="confirmDialog.open('Desea ver los resultados de ' + al['APELLIDO_P'] + ' ' + al['APELLIDO_M'] + ' ' + al['NOMBRE']); alumnoSeleccionado = al.idAlumno">

                            @for (item of encabezados; track $index) {
                                <td class="whitespace-nowrap px-3 py-2.5 text-center font-medium text-gray-700">
                                    <span class="inline-flex min-w-7 items-center justify-center rounded-md px-2 py-1"
                                        [ngClass]="al[item] == 1 && !preescolar ? 'bg-emerald-100 text-emerald-700 font-bold' : ''">
                                        {{ al[item] }}
                                    </span>
                                </td>
                            }
                        </tr>
                    }
                </tbody>
            </table>
        </div>
    </div>
}

<app-confirm-dialog #confirmDialog (confirm)="confirmarVerDetalles()" (cancel)="alumnoSeleccionado = ''"></app-confirm-dialog>
