<div
    class="group relative overflow-hidden rounded-2xl border border-slate-200 bg-white p-4 shadow-sm transition-all duration-300 hover:-translate-y-0.5 hover:border-teal-200 hover:shadow-md">

    @if (title != '') {

        <div
            class="absolute left-0 top-0 h-full w-1 bg-teal-500">
        </div>

    }

    <div class="pl-2">

        @if (title != '') {

            <div class="flex items-start justify-between gap-3">

                <div class="flex items-center gap-2">

                    <div
                        class="flex h-8 w-8 items-center justify-center rounded-lg bg-teal-50 text-teal-600">

                        <i class="pi pi-book text-xs"></i>

                    </div>

                    <p
                        class="text-xs font-semibold uppercase tracking-wide text-teal-700">

                        {{ title }}

                    </p>

                </div>

            </div>

        }

        <div class="mt-3 flex items-end justify-between gap-3">

            <div>

                <p
                    class="text-[11px] font-medium text-slate-400">
                    Resultado
                </p>

                <p
                    class="mt-0.5 text-2xl font-bold text-slate-900">

                    {{ contenido }}%

                </p>

            </div>

            <div
                class="flex h-9 w-9 items-center justify-center rounded-xl bg-teal-50 text-teal-500 transition-colors group-hover:bg-teal-100">

                <i class="pi pi-chart-line text-sm"></i>

            </div>

        </div>

        <div class="mt-3">

            <div
                class="h-1.5 overflow-hidden rounded-full bg-teal-100">

                <div
                    class="h-full rounded-full bg-teal-500 transition-all duration-500"
                    [style.width.%]="+contenido">
                </div>

            </div>

        </div>

    </div>

</div>
