<div class="overflow-hidden rounded-lg border border-gray-200 bg-white shadow-sm">
    @if(title != ''){
        <div class="h-1.5 w-full" [ngClass]="bgColorTitle"></div>
    }

    <div class="px-4 py-3 text-center">
        @if(title != ''){
            <p class=" font-bold uppercase tracking-[0.15em] text-gray-500">{{ title }}</p>
        }

        <p class="mt-1 text-xl font-bold capitalize text-gray-600">{{ contenido }}</p>
    </div>
</div>
