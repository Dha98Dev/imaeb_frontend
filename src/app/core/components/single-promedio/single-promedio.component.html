<div class="group relative flex items-center justify-between overflow-hidden rounded-2xl border border-gray-200 bg-white p-5 shadow-sm transition-all duration-300 hover:-translate-y-1 hover:shadow-lg dark:!border-zinc-700 dark:!bg-zinc-800 dark:!shadow-none dark:hover:!border-zinc-600 dark:hover:!bg-zinc-700">

    <div class="absolute bottom-0 left-0 top-0 w-1.5" [ngClass]="!isEstatal ? 'bg-c1' : 'bg-c2'"></div>

    <div class="pl-2">
        <p class="text-xs font-semibold uppercase tracking-[0.18em] text-gray-400 dark:!text-zinc-400">
            Promedio
        </p>

        <h3 class="mt-1 text-base font-bold text-gray-700 dark:!text-zinc-200">
            {{ title }}
        </h3>
    </div>

    <h4 class="text-4xl font-black tracking-tight text-gray-800 md:text-5xl dark:!text-zinc-100">
        {{ content }}
    </h4>

</div>
