<app-header></app-header>

<div class="mx-2 mb-4 mt-4">

    <div class="flex justify-end">

        @if (items.length > 0) {

        <div
            class="flex max-w-full items-center gap-1 overflow-x-auto rounded-xl border border-slate-200 bg-white p-1 shadow-sm">

            @for (
            item of items;
            track item.label
            ) {

            <button type="button" (click)="seleccionarTab(item, $event)"
                class="group inline-flex shrink-0 items-center gap-2 rounded-lg px-3 py-2 text-xs font-semibold transition-all duration-200"
                [ngClass]="{
                            'bg-slate-900 text-white shadow-sm':
                                tabActivo === item.label,

                            'text-slate-500 hover:bg-slate-100 hover:text-slate-800':
                                tabActivo !== item.label
                        }">

                @if (item.icon) {

                <i [class]="item.icon" class="text-xs">
                </i>

                }

                <span>
                    {{ item.label }}
                </span>

            </button>

            }

        </div>

        }

    </div>

</div>


<div class="mx-auto w-full max-w-screen-xl px-4 pb-5 sm:px-6 lg:px-8">

    <router-outlet></router-outlet>

</div>
