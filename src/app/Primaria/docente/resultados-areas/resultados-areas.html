@if (loader) {
<app-loader-page></app-loader-page>
}

@if (!loader) {
<div class="flex justify-center">
    <app-subtitle [subtitle]="getSubtitle"></app-subtitle>
</div>
<div class="flex justify-end px-5">
    <div class="inline-flex gap-1 rounded-xl border border-gray-200 bg-gray-100 p-1">
        <button type="button" (click)="onPick(1)" class="flex items-center gap-2 rounded-lg px-3 py-2 text-sm font-semibold transition-all duration-200" [ngClass]="materiaSelected == 1 ? 'bg-c2 text-white shadow-md' : 'text-gray-500 hover:bg-white hover:text-gray-700'">
            <i class="pi pi-book text-sm"></i><span>Lenguaje</span>
        </button>

        @if(nivel != 1){
            <button type="button" (click)="onPick(3)" class="flex items-center gap-2 rounded-lg px-3 py-2 text-sm font-semibold transition-all duration-200" [ngClass]="materiaSelected == 3 ? 'bg-c2 text-white shadow-md' : 'text-gray-500 hover:bg-white hover:text-gray-700'">
                <i class="pi pi-chart-pie text-sm"></i><span>Matemáticas</span>
            </button>

            <button type="button" (click)="onPick(4)" class="flex items-center gap-2 rounded-lg px-3 py-2 text-sm font-semibold transition-all duration-200" [ngClass]="materiaSelected == 4 ? 'bg-c2 text-white shadow-md' : 'text-gray-500 hover:bg-white hover:text-gray-700'">
                <i class="pi pi-building text-sm"></i><span>Ciencias</span>
            </button>
        }

        @if(nivel == 1){
            <button type="button" (click)="onPick(2)" class="flex items-center gap-2 rounded-lg px-3 py-2 text-sm font-semibold transition-all duration-200" [ngClass]="materiaSelected == 2 ? 'bg-c2 text-white shadow-md' : 'text-gray-500 hover:bg-white hover:text-gray-700'">
                <i class="pi pi-sparkles text-sm"></i><span>Saberes y pensamiento científico</span>
            </button>
        }
    </div>
</div>


<div class="tabla px-3">
    @for (item of dataChart; track $index) {
    <div class="contenedor-chart mt-[50px] shadow-md ">
        <div>
            <app-item-chart-resltado-area [unidadAnalisis]="item.unidad" [alumnos]="item.totalAlumnos.toString()"
                [aciertos]="item.porcentajeAciertos+'%'" [desaciertos]="item.porcentajeDesaciertos+'%'"
                [dataSet]="item.dataChart"></app-item-chart-resltado-area>
        </div>
    </div>
    }

</div>


}
